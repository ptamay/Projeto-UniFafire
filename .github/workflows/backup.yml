# TASK-078 (Sprint 23 · Etapa 7b do ADR-012) — backup diário verificado.
# constitution §4.3, corrigida no CR Tipo D de 2026-09-04.
#
# ## Por que este workflow existe
#
# A §4.3 dizia "backup diário gerenciado pelo provedor, verificado por job
# agendado". O plano gratuito do Supabase NÃO tem backup gerenciado — a própria
# documentação recomenda `db dump` + off-site para esse plano. Este job é o meio;
# o alvo (RPO 24 h, RTO 4 h, verificação obrigatória) não mudou.
#
# ## O que este arquivo NÃO decide
#
# Ele não decide se o backup prestou. Isso é `db/verify-dump.mjs`, que tem teste.
# YAML não tem teste, e um erro de reconciliação escrito aqui só apareceria no
# dia em que o backup fosse necessário.
#
# ## Antes da primeira execução (feito pelo usuário — ver docs/runbook-deploy.md)
#
#   1. Criar um repositório PRIVADO para os dumps.
#      O repositório do CÓDIGO é público, e em repo público os artefatos de
#      workflow são baixáveis por qualquer pessoa. O dump não pode encostar aqui.
#   2. Cadastrar os secrets deste repositório:
#      - PROD_DATABASE_URL  → string de conexão do Supabase (pooler)
#      - BACKUP_REPO        → "usuario/nome-do-repo-privado"
#      - BACKUP_REPO_TOKEN  → PAT com escrita APENAS nesse repositório
#
# Enquanto os secrets não existirem, o job falha na primeira etapa — o que é o
# comportamento certo: um backup que não roda tem de ser barulhento.

name: Backup diário verificado

on:
  schedule:
    # TASK-112 (ADR-024) — de hora em hora, e quem decide se há backup é o job
    # `agenda`, lendo o que o ADMIN configurou na tela (padrão: 03:00 de Recife, 1×
    # por dia). O `cron` do Actions é fixo no arquivo; a agenda, não.
    #
    # Minuto 17, e não 0: o GitHub congestiona na virada da hora e atrasa agendas.
    # O portão não depende da pontualidade — ele pergunta se há horário vencido sem
    # backup —, mas quanto menos atraso, mais perto do horário que a tela mostra.
    #
    # Repositório público: os minutos de Actions são gratuitos. Nas horas sem
    # backup, só o job `agenda` roda (e sai), e o Postgres de verificação nem sobe.
    - cron: '17 * * * *'
  # Permite rodar à mão para testar sem esperar um dia — e para o ensaio de
  # restauração que a §4.3 exige do responsável.
  workflow_dispatch:

# Um backup por vez. Duas execuções simultâneas escreveriam o mesmo arquivo no
# repositório de destino e uma sobrescreveria a outra pela metade.
concurrency:
  group: backup-diario
  cancel-in-progress: false

# TASK-110 (ADR-023) — só ler o próprio código, para o checkout. O push do dump vai para
# o repositório PRIVADO com o BACKUP_REPO_TOKEN, e não com o token padrão do Actions —
# que, sem esta linha, podia escrever neste repositório, e com ele qualquer passo do job
# (inclusive uma dependência do `npm ci`).
permissions:
  contents: read

jobs:
  # TASK-112 — o portão. Pergunta "há horário vencido sem backup bem-sucedido depois
  # dele?" (e não "é a hora?", que perderia o dia inteiro quando o GitHub atrasa o
  # disparo para depois da hora). Execução manual sempre passa. Se a agenda não puder
  # ser lida, EXECUTA: portão que falha fechado deixa de fazer backup em silêncio.
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      executar: ${{ steps.decisao.outputs.executar }}
      # TASK-113 — vazio quando a agenda não pôde ser lida: aí o envio não apaga nada.
      retencao: ${{ steps.decisao.outputs.retencao }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Conferir a agenda
        id: decisao
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          EVENTO: ${{ github.event_name }}
        run: node db/agenda-backup.mjs >> "$GITHUB_OUTPUT"

  backup:
    # Só roda quando a agenda manda. Job separado, e não `if:` passo a passo: o
    # passo "Registrar a execução (sempre)" usa `if: always()` e gravaria SUCESSO
    # nas horas puladas — a métrica de confiabilidade leria backup onde não houve.
    needs: agenda
    if: needs.agenda.outputs.executar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Base DESCARTÁVEL onde o dump é restaurado para verificação. Precisa ser
      # separada da origem: restaurar por cima da produção para "conferir" seria
      # trocar o risco de perder dados pelo risco de destruí-los.
      verificacao:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verificacao
          POSTGRES_DB: verificacao
        ports: ['55433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # `pg_dump` 17 lê servidores 15 e 17 — cliente mais novo que o servidor é
      # a direção compatível. O contrário não é.
      PGDUMP_IMAGE: postgres:17
      ARQUIVO: dump.sql.gz
      # A URL da base de verificacao e montada por partes, e nao escrita inteira.
      # Ela nao e segredo — e um container efemero, so alcancavel de dentro deste
      # job —, mas string com forma de credencial num arquivo versionado e a
      # coisa exata que uma varredura de secrets deve poder proibir sem excecao.
      # Sem literal, nao ha excecao a manter.
      VERIFICACAO_HOST: localhost
      VERIFICACAO_PORTA: '55433'
      VERIFICACAO_USUARIO: postgres
      VERIFICACAO_BANCO: verificacao

    steps:
      - uses: actions/checkout@v4

      - name: Montar a URL da base de verificacao
        run: |
          echo "VERIFICACAO_URL=postgresql://${VERIFICACAO_USUARIO}:${POSTGRES_PASSWORD}@${VERIFICACAO_HOST}:${VERIFICACAO_PORTA}/${VERIFICACAO_BANCO}" >> "$GITHUB_ENV"
        env:
          POSTGRES_PASSWORD: verificacao

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `--schema=public` NAO e detalhe de otimizacao. Sem ele o dump emite
      # `CREATE EXTENSION supabase_vault` e outras extensoes da PLATAFORMA
      # Supabase; a base de verificacao e um postgres puro, que nao as tem, e a
      # restauracao aborta antes da primeira linha de dado. Foi assim que a
      # primeira execucao real falhou (run 34037968370, 2026-09-06).
      #
      # As 11 tabelas da aplicacao vivem todas em `public`. As extensoes da
      # plataforma sao recriadas por qualquer projeto Supabase novo. Escopar
      # torna o dump portatil nos dois destinos de uma recuperacao: Postgres
      # puro e projeto Supabase novo.
      - name: Gerar o dump
        id: dump
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm --network host \
            "$PGDUMP_IMAGE" pg_dump "$DATABASE_URL" \
            --schema=public \
            --no-owner --no-privileges --format=plain \
            | gzip -9 > "$ARQUIVO"
          echo "size=$(stat -c%s "$ARQUIVO")" >> "$GITHUB_OUTPUT"

      - name: Restaurar numa base descartável e reconciliar contagens
        id: verificar
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          # A base de verificacao precisa estar VAZIA, e nao so parecer vazia.
          # Duas razoes, e a segunda importa mais: (1) o dump escopado emite
          # `CREATE SCHEMA public` e o container ja nasce com um; (2) a
          # reconciliacao trata objeto a mais no destino como divergencia,
          # supondo base limpa — isto passa a garantir a suposicao. Mesmo gesto
          # do `tests/global-setup-pg.ts`.
          docker run --rm --network host "$PGDUMP_IMAGE" psql "$VERIFICACAO_URL" -v ON_ERROR_STOP=1 -q -c 'DROP SCHEMA IF EXISTS public CASCADE;'

          gunzip -c "$ARQUIVO" | docker run --rm -i --network host \
            "$PGDUMP_IMAGE" psql "$VERIFICACAO_URL" -v ON_ERROR_STOP=1 -q
          node db/verify-dump-cli.mjs "$DATABASE_URL" "$VERIFICACAO_URL"

      # TASK-113 (ADR-024, decisão 2) — envia E aplica a retenção, apagando de verdade:
      # o repositório privado é republicado como um commit só, com os dumps da janela, e
      # o que sai dela deixa de estar no histórico. Irreversível por desenho — é o ponto.
      #
      # Por isso vem DEPOIS da restauração de verificação, sem `if: always()` nem
      # `continue-on-error`: se o dump novo não foi verificado, este passo nem roda.
      #
      # A orquestração mora em `db/enviar-backup.mjs`, exercitada contra um repositório
      # git de verdade em `tests/retencao-backup.test.ts` — e não aqui, onde um
      # `git push --force` não teria teste nenhum. Lição do go-live.
      - name: Enviar para o repositório privado e aplicar a retenção
        id: enviar
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
          RETENCAO: ${{ needs.agenda.outputs.retencao }}
        run: node db/enviar-backup.mjs --arquivo "$ARQUIVO" --dias "$RETENCAO" >> "$GITHUB_OUTPUT"

      # `always()` é o que transforma falha em REGISTRO. Sem ele, um job que
      # quebra no meio não deixa rastro, e a métrica da TASK-075 lê "nenhuma
      # execução" — que é a leitura errada e tranquilizadora.
      - name: Registrar a execução (sempre)
        if: always()
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            node db/backup-run.mjs --ok \
              --size "${{ steps.dump.outputs.size }}" \
              --dest "${{ steps.enviar.outputs.destino }}"
          else
            node db/backup-run.mjs --fail \
              --error "job ${{ job.status }} — ver a execução ${{ github.run_id }}"
          fi
