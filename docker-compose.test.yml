# TASK-068 (Sprint 21 · decisão D1) — Postgres real para a suíte de testes.
#
# Recomendação do ADR-012 e decisão do usuário: testar contra o mesmo dialeto de
# produção. SQLite em memória não exercitaria os triggers PL/pgSQL nem o bypass
# por set_config que a TASK-065 entregou — e a Sprint 21 reescreve 162 chamadas
# tendo a suíte como única rede de segurança.
#
#   npm run test:db:up     sobe (idempotente)
#   npm run test:db:down   derruba e apaga o volume
#
# Porta 15432 de propósito, por DOIS motivos — o segundo custou uma manhã:
#
#   1. Não colide com um Postgres que já esteja instalado na máquina na 5432.
#   2. Está FORA da faixa dinâmica do Windows (49152-65535, confira com
#      `netsh interface ipv4 show dynamicport tcp`). O WinNAT/Hyper-V reserva
#      blocos DENTRO dessa faixa e os remaneja a cada reinício do host ou do
#      Docker. Em 2026-09-08 a porta antiga, 55432, caiu dentro do bloco
#      55373-55472 e o `up` passou a falhar com "bind: An attempt was made
#      to access a socket in a way forbidden by its access permissions".
#      Escolher outro número acima de 49152 só adiaria o mesmo dia; abaixo
#      dela o WinNAT não chega.
#
# Diagnóstico: `netsh interface ipv4 show excludedportrange protocol=tcp`.

services:
  postgres-test:
    image: postgres:17-alpine
    container_name: unifafire-postgres-test
    environment:
      POSTGRES_USER: unifafire
      POSTGRES_PASSWORD: unifafire_test
      POSTGRES_DB: unifafire_test
      # Banco descartável: fsync desligado troca durabilidade por velocidade, o
      # que aqui é ganho puro — o volume é apagado a cada `test:db:down`.
      POSTGRES_INITDB_ARGS: "--no-sync"
    command: >
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unifafire -d unifafire_test"]
      interval: 2s
      timeout: 3s
      retries: 20
